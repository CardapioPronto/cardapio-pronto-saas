  <style>
    :root {
      --pubfy-beige: #F2CC8F;
      --pubfy-green: #81B29A;
      --pubfy-navy: #3D405B;
    }
    html, body { margin: 0; padding: 0; height: 100%; }
    body { background: #FAF8F2; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #root { min-height: 100%; }
    #pubfy-initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #FAF8F2;
      z-index: 9999;
    }
    #pubfy-initial-loader .pubfy-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    #pubfy-initial-loader .pubfy-brand-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--pubfy-navy);
      letter-spacing: -0.02em;
    }
    #pubfy-initial-loader .pubfy-spinner {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid rgba(61, 64, 91, 0.12);
      border-top-color: var(--pubfy-green);
      animation: pubfy-spin 0.9s linear infinite;
    }
    @keyframes pubfy-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #pubfy-initial-loader .pubfy-spinner { animation: none; }
    }
  </style>
</head>

  <body>
    <div id="root">
      <div id="pubfy-initial-loader" role="status" aria-label="Carregando Pubfy">
        <div class="pubfy-brand">
          <span class="pubfy-brand-name">Pubfy</span>
        </div>
        <div class="pubfy-spinner" aria-hidden="true"></div>
      </div>
    </div>
